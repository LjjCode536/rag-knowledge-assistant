[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "企业 AI 知识库:生产级 RAG 服务(评估驱动迭代)"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langchain-text-splitters>=1.1.3",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.3",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # starlette 1.10 的 TestClient 仍可用 httpx,等官方切换 httpx2 后再跟进
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
